[package]
name = "playlist-mix"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Resumable, beat-aligned YouTube Music playlist mixes without time stretching"
license = "MIT"

[dependencies]
anyhow = "=1.0.100"
beat-this = { version = "=1.1.0", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
ureq = "=3.4.2"

[dev-dependencies]
hound = "=3.5.1"
tempfile = "=3.23.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
